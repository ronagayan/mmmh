name: Build NFC Master APK

on:
  push:
    paths:
      - "nfc-app/**"
      - ".github/workflows/nfc-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        working-directory: nfc-app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp nfc-app/app/build/outputs/apk/release/app-release.apk NFC-Master.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NFC-Master-apk
          path: NFC-Master.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nfc-master-build-${{ github.run_number }}
          name: NFC Master build ${{ github.run_number }}
          prerelease: true
          files: NFC-Master.apk
          body: |
            NFC Master APK built from `${{ github.ref_name }}` @ ${{ github.sha }}.
            Download **NFC-Master.apk** below and install it on an Android phone (Android 7.0+ with NFC).
